    /* 01. Page palette and reset — applies to this document only. */
    :root {
      color-scheme: dark;
      --navy: #0b172b;
      --blue: #20315c;
      --ice: #dbeaf2;
      --cyan: #78bfd7;
      --white: #ffffff;
      --reveal-ease: cubic-bezier(.16, 1, .3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 50% 5%, #23395d 0%, transparent 55%),
        radial-gradient(ellipse at 0% 85%, #122d42 0%, transparent 48%),
        linear-gradient(145deg, #101d34 0%, #0b172b 50%, #060d18 100%);
    }

    /* 02. Quiet architectural lines and light; decorative and noninteractive. */
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      animation: ambient-enter 1800ms ease-out backwards;
    }
    .ambient::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14%;
      right: 14%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #80bed0, transparent);
      opacity: .65;
    }
    .ambient svg {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      animation: architecture-drift 24s ease-in-out infinite alternate;
    }
    .ambient .glow {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse at 36% 37%, #419ab54a 0%, transparent 39%),
        radial-gradient(ellipse at 77% 60%, #5069b53b 0%, transparent 43%);
      opacity: .45;
      animation: light-drift 18s ease-in-out infinite alternate;
    }
    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, transparent 20%, #060e1955 100%);
    }

    /* 03. Centered original brand and page title. The logo artwork is embedded. */
    main {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 80px 32px 56px;
    }
    .entry { width: min(100%, 900px); text-align: center; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.4vw, 28px);
      width: min(100%, 820px);
      margin: 0 auto;
      animation: brand-enter 1100ms var(--reveal-ease) 100ms backwards;
    }
    .brand svg {
      display: block;
      height: auto;
      filter: brightness(0) invert(1);
    }
    .brand .brand-symbol { flex: 0 0 11%; width: 11%; }
    .wordmark { flex: 1; min-width: 0; }
    .wordmark svg { width: 100%; }
    .accent {
      width: 40px;
      height: 2px;
      margin: 40px auto 22px;
      border: 0;
      background: var(--cyan);
      box-shadow: 0 0 24px #78bfd740;
      animation: accent-enter 900ms var(--reveal-ease) 300ms backwards;
    }
    h1 {
      margin: 0;
      color: var(--ice);
      font-family: "Label Center Sans", "Segoe UI", Arial, sans-serif;
      font-size: clamp(26px, 3.1vw, 42px);
      font-weight: 300;
      letter-spacing: .18em;
      text-indent: .18em;
      line-height: 1.35;
      animation: content-enter 1000ms var(--reveal-ease) 360ms backwards;
    }

    /* 04. Native links; each opens the existing program in its own tab. */
    .clinics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 52px auto 0;
    }
    .clinic {
      animation: content-enter 900ms var(--reveal-ease) 600ms backwards;
    }
    .clinic:nth-child(2) { animation-delay: 720ms; }
    .clinic-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 236px;
      min-height: 66px;
      padding: 20px 25px;
      border: 1px solid #b0cee02e;
      border-radius: 8px;
      background: linear-gradient(120deg, #233b5b52, #16273e26);
      box-shadow: inset 0 1px 0 #d2efff06;
      color: #f2f7fb;
      font-family: "Label Center Sans", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: .15em;
      text-indent: .15em;
      text-align: center;
      text-decoration: none;
      transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease;
    }
    .clinic-link:hover {
      transform: translateY(-2px);
      background-color: #25456670;
      border-color: #78bfd78c;
    }
    .clinic-link:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 5px;
      border-color: var(--cyan);
    }
    .clinic-link:active { transform: translateY(0); }

    /* 05. Small, centered guide — normal flow prevents overlap at any height. */
    .guide {
      position: relative;
      width: min(100% - 48px, 620px);
      margin: 0 auto;
      padding: 22px 0 34px;
      border-top: 1px solid #97bad021;
      text-align: center;
      animation: content-enter 1000ms var(--reveal-ease) 900ms backwards;
    }
    .guide h2 {
      margin: 0 0 16px;
      color: #94afc2;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: .22em;
      text-indent: .22em;
    }
    .guide ol {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 26px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .guide li {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a7bbcd;
      font-size: 12px;
      line-height: 1.5;
      white-space: nowrap;
    }
    .step-number {
      color: #78bfd7;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .05em;
    }

    /* 06. Coordinated entry: brand, accent, title, clinics, then guide.
       Backwards fill leaves the finished elements in their natural state.
       Clinic wrappers animate separately from link transforms used by hover. */
    @keyframes brand-enter {
      from { opacity: 0; transform: translateY(16px) scale(.985); filter: blur(5px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    @keyframes content-enter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes accent-enter {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }
    @keyframes ambient-enter { from { opacity: 0; } to { opacity: 1; } }
    @keyframes light-drift {
      from { transform: translate3d(-3%, -2%, 0) scale(1); opacity: .35; }
      to { transform: translate3d(4%, 3%, 0) scale(1.08); opacity: .7; }
    }
    @keyframes architecture-drift {
      from { transform: translate3d(-.75%, .5%, 0); }
      to { transform: translate3d(.75%, -.5%, 0); }
    }

    /* 07. Small screens and system accessibility preferences. */
    @media (max-width: 600px) {
      main { padding: 72px 24px 56px; }
      .brand { gap: 12px; }
      .brand .brand-symbol { flex-basis: 12%; width: 12%; }
      .accent { margin-top: 32px; }
      .clinics { flex-direction: column; gap: 12px; margin-top: 38px; }
      .clinic { width: min(100%, 320px); }
      .clinic-link { width: 100%; min-width: 0; min-height: 62px; }
      .guide { padding-bottom: 24px; }
      .guide ol { gap: 8px 16px; }
    }
    /* Keyboard focus is never hidden behind a delayed entrance animation. */
    .clinic:focus-within { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .clinic-link:hover { transform: none; }
    }
    @media (forced-colors: active) {
      .ambient, .accent, .step-number { display: none; }
      .clinic-link { border: 1px solid ButtonText; }
      .clinic-link:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
